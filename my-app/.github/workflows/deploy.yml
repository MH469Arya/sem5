name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

# ─────────────────────────────────────────────
# Stage 1 → Build   (GitHub-hosted runner)
# Stage 2 → Test    (GitHub-hosted runner)
# Stage 3 → Deploy  (manual — see README / run locally with Docker Desktop)
# ─────────────────────────────────────────────

jobs:

  # ── Stage 1: Build ──────────────────────────
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: my-app/package.json

      - name: Install dependencies
        working-directory: my-app
        run: npm install --omit=dev

      - name: Confirm build artefacts
        working-directory: my-app
        run: |
          echo "── Build complete ──"
          echo "app.js       : $(test -f app.js && echo OK || echo MISSING)"
          echo "public/index : $(test -f public/index.html && echo OK || echo MISSING)"

  # ── Stage 2: Test ───────────────────────────
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: my-app/package.json

      - name: Install dependencies
        working-directory: my-app
        run: npm install

      - name: Run tests
        working-directory: my-app
        run: npm test

  # ── Stage 3: Deploy ─────────────────────────
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy instructions
        run: |
          echo "=========================================="
          echo "  ✅ Build & Test passed!"
          echo "  🚀 To deploy manually with Docker Desktop"
          echo "     run the commands below on your machine:"
          echo ""
          echo "  cd my-app"
          echo "  docker build -t webapp:latest ."
          echo "  docker run -d -p 3000:3000 --name calculator webapp:latest"
          echo ""
          echo "  Then open: http://localhost:3000"
          echo "=========================================="
