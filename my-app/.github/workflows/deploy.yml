name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/mh469arya/webapp

permissions:
  contents: read
  packages: write

jobs:

  # ── Stage 1: Build ──────────────────────────────────────────
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: my-app/package.json

      - name: Install dependencies
        working-directory: my-app
        run: npm install --omit=dev

      - name: Verify build artefacts
        working-directory: my-app
        run: |
          test -f app.js            && echo "✔ app.js found"            || (echo "✘ app.js missing"            && exit 1)
          test -f public/index.html && echo "✔ public/index.html found" || (echo "✘ public/index.html missing" && exit 1)
          test -f Dockerfile        && echo "✔ Dockerfile found"        || (echo "✘ Dockerfile missing"        && exit 1)
          echo "✅ Build stage passed"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./my-app
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  # ── Stage 2: Test ───────────────────────────────────────────
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: my-app/package.json

      - name: Install dependencies
        working-directory: my-app
        run: npm install

      - name: Run tests
        working-directory: my-app
        run: npm test

      - name: Test summary
        run: echo "✅ Test stage passed — all smoke tests green"

  # ── Stage 3: Deploy (runs on your machine via self-hosted runner) ──
  deploy:
    name: 🚀 Deploy
    runs-on: self-hosted
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: my-app
        run: docker build -t webapp:latest .

      - name: Stop and remove existing container (if any)
        run: docker rm -f calculator 2>$null; exit 0

      - name: Run new container
        run: docker run -d -p 3000:3000 --name calculator webapp:latest

      - name: Apply Kubernetes manifests
        working-directory: my-app
        run: kubectl apply -f k8s/

      - name: Restart Kubernetes deployment
        run: kubectl rollout restart deployment/webapp

      - name: Wait for rollout
        run: kubectl rollout status deployment/webapp --timeout=120s

      - name: Done
        run: echo "✅ Deploy stage passed — app live at http://localhost:3000"
