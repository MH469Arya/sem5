name: CI/CD
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t webapp:${{ github.sha }} .

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/webapp webapp=webapp:${{ github.sha }}
          kubectl rollout status deployment/webapp --timeout=90s